name: Build Windows .exe

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    paths:
      - 'app.py'
      - 'analyzer.py'
      - 'image_gen.py'
      - 'prompts.py'
      - 'requirements.txt'
      - '.github/workflows/build-windows.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller==6.11.1

      - name: Build StoryViz.exe (windowed)
        run: >
          pyinstaller
          --onefile
          --windowed
          --name StoryViz
          --collect-all customtkinter
          --collect-all google.genai
          --collect-all google.auth
          --collect-all google.api_core
          --collect-all pydantic
          --collect-all pydantic_core
          --collect-all httpx
          --collect-all httpcore
          --collect-all anyio
          --collect-all certifi
          --collect-submodules readability
          --collect-submodules bs4
          --copy-metadata google-genai
          --copy-metadata pydantic
          --hidden-import PIL._tkinter_finder
          --hidden-import PIL.ImageTk
          --hidden-import lxml._elementpath
          --hidden-import lxml.html.clean
          app.py

      - name: Build StoryViz-debug.exe (console)
        run: >
          pyinstaller
          --onefile
          --console
          --name StoryViz-debug
          --collect-all customtkinter
          --collect-all google.genai
          --collect-all google.auth
          --collect-all google.api_core
          --collect-all pydantic
          --collect-all pydantic_core
          --collect-all httpx
          --collect-all httpcore
          --collect-all anyio
          --collect-all certifi
          --collect-submodules readability
          --collect-submodules bs4
          --copy-metadata google-genai
          --copy-metadata pydantic
          --hidden-import PIL._tkinter_finder
          --hidden-import PIL.ImageTk
          --hidden-import lxml._elementpath
          --hidden-import lxml.html.clean
          app.py

      - name: Verify .exes exist
        run: |
          if (!(Test-Path dist/StoryViz.exe)) { throw 'StoryViz.exe not found' }
          if (!(Test-Path dist/StoryViz-debug.exe)) { throw 'StoryViz-debug.exe not found' }
          Get-Item dist/StoryViz.exe, dist/StoryViz-debug.exe | Format-List Name, Length, LastWriteTime

      - name: Smoke-test StoryViz.exe (start → close after 5s)
        run: |
          $proc = Start-Process -FilePath dist/StoryViz.exe -PassThru
          Start-Sleep -Seconds 5
          if ($proc.HasExited) {
            Write-Host "::error::StoryViz.exe exited within 5 seconds (exit code $($proc.ExitCode))"
            if (Test-Path dist/storyviz-error.log) {
              Write-Host '--- storyviz-error.log ---'
              Get-Content dist/storyviz-error.log
            }
            exit 1
          }
          Write-Host "OK — still running after 5s, stopping"
          Stop-Process -Id $proc.Id -Force

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: StoryViz-windows
          path: |
            dist/StoryViz.exe
            dist/StoryViz-debug.exe
          if-no-files-found: error

      - name: Create GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/StoryViz.exe
            dist/StoryViz-debug.exe
          generate_release_notes: true
          body: |
            # StoryViz ${{ github.ref_name }}

            Phân tích truyện chữ tiếng Việt → prompt ảnh (Imagen / Nano Banana) + prompt video (Grok / Veo 3 / Seedance / Runway Gen-3 / Kling / Pika).

            ## Cài đặt

            1. Tải **`StoryViz.exe`** ở phần Assets bên dưới.
            2. Double-click để chạy. Lần đầu Windows SmartScreen có thể cảnh báo "Unrecognized app" — bấm **More info → Run anyway** (vì .exe chưa được code-sign).
            3. Lấy Google AI API key ở https://aistudio.google.com/app/apikey, dán vào ô **Google AI API key** trong app.

            ## Nếu mở không lên

            1. Thử `StoryViz-debug.exe` — phiên bản có console, sẽ in lỗi ra cửa sổ lệnh để bạn copy.
            2. Hoặc xem file `storyviz-error.log` tạo ra cạnh file `.exe` sau khi crash.

            ## Yêu cầu Google AI account

            - **Free tier**: `gemini-2.5-flash` (text) + Nano Banana (image) — đủ test, có quota daily.
            - **Paid plan** (https://ai.dev/projects): mở khoá `gemini-2.5-pro` + Imagen 4 + quota cao hơn. Imagen 4 Fast ~$0.02/ảnh.
